    <circle cx="71" cy="62" r="4" fill="#72e2ba"/>
    <text x="84" y="67" fill="#a6edce" font-size="12" font-weight="600" letter-spacing="1.1">MACOS · OPEN SOURCE</text>
    <text x="54" y="152" fill="#f3f7ff" font-size="65" font-weight="700" letter-spacing="-2">Codenotch</text>
    <text x="57" y="198" fill="url(#accent)" font-size="30" font-weight="500">Codex &amp; System</text>
    <text x="57" y="252" fill="#c1ccdf" font-size="23">Всё важное — у края экрана.</text>
    <text x="57" y="287" fill="#8797b1" font-size="17">Лимиты Codex. Состояние Mac. Один взгляд.</text>
    <path d="M57 329H540" stroke="#28374c"/>
    <text x="57" y="361" fill="#9baac0" font-size="14">РУССКИЙ ИНТЕРФЕЙС</text>
    <circle cx="258" cy="356" r="2" fill="#58748c"/>
    <text x="275" y="361" fill="#9baac0" font-size="14">ЛОКАЛЬНЫЕ ДАТЧИКИ</text>
    <rect x="660" y="45" width="486" height="328" rx="25" fill="#111e30" stroke="#2b3d56"/>
