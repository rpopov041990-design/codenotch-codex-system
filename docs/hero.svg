<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Codenotch — Codex &amp; System</title>
  <desc id="desc">Лимиты Codex и состояние Mac в одной панели. Декоративная схема индикаторов, не снимок приложения.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#66e0cb"/><stop offset="1" stop-color="#71a9ff"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="10" r="240" fill="#162a43" opacity=".45"/>
  <circle cx="1100" cy="440" r="190" fill="#153e39" opacity=".32"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
